<!doctype html>
<!-- Generated by build-playable.cjs from the platformer sources. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Electron Energy | Platform Trials</title>
  <style>
:root {
  color-scheme: dark;
  --surface: #171c1f;
  --line: #394448;
  --text: #f3f5ee;
  --muted: #b6c4c2;
  --mint: #9ef2ce;
  --amber: #ffbd79;
  font-family: system-ui, sans-serif;
}

* { box-sizing: border-box; }
body { margin: 0; background: #111416; color: var(--text); }
button { font: inherit; color: inherit; cursor: pointer; }
[hidden] { display: none !important; }

.game-shell {
  display: grid;
  grid-template-rows: auto minmax(340px, 1fr) auto;
  min-height: 100dvh;
}

.game-shell:has(.level-home:not([hidden])) {
  grid-template-rows: auto minmax(min-content, 1fr);
}

.topbar, .workbench {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 22px;
  background: var(--surface);
}

.topbar { border-bottom: 1px solid var(--line); }
.identity { display: flex; align-items: center; gap: 12px; margin-right: auto; }
.identity strong { display: block; font-size: 17px; }
.identity div span { display: block; color: var(--muted); font-size: 12px; }
.insignia {
  flex: 0 0 34px;
  width: 34px;
  height: 34px;
  background: var(--mint);
  clip-path: polygon(44% 4%, 91% 4%, 69% 40%, 96% 40%, 36% 96%, 49% 57%, 14% 57%);
}

.secondary, .touch-controls button {
  min-height: 40px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #222a2c;
}
.secondary { padding: 0 13px; }
.secondary:hover { background: #354244; }
.shop-button { display: inline-flex; align-items: center; gap: 8px; }
.credit-total { color: var(--amber); font: 750 12px ui-monospace, monospace; white-space: nowrap; }

.shop-dialog {
  width: min(500px, calc(100% - 28px));
  max-height: calc(100dvh - 28px);
  border: 1px solid #55625f;
  border-radius: 8px;
  padding: 0;
  background: var(--surface);
  color: var(--text);
}
.shop-dialog::backdrop { background: #0a0e11ba; }
.shop-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 18px;
  border-bottom: 1px solid var(--line);
}
.shop-header h2 { margin: 0 0 5px; font-size: 22px; }
.shop-tabs { display: flex; gap: 6px; padding: 12px 18px 4px; }
.shop-tabs .secondary { flex: 1 1 0; }
.shop-tabs [aria-pressed="true"] { border-color: var(--mint); color: var(--mint); background: #2f4340; }
.upgrade-list { padding: 0 18px; }
.upgrade-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  min-height: 74px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}
.upgrade-details { display: grid; gap: 4px; }
.upgrade-stat { color: var(--muted); font-size: 13px; }
.upgrade-buy { min-width: 84px; color: var(--mint); font-weight: 750; white-space: nowrap; }
.upgrade-buy:disabled { color: var(--muted); background: #202729; cursor: default; }
.shop-feedback { min-height: 20px; margin: 12px 18px 16px; color: var(--mint); font-size: 14px; }
.skin-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 8px 18px 0; }
.skin-card {
  min-width: 0;
  display: grid;
  grid-template-rows: 82px 1fr auto;
  gap: 7px;
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #222a2c;
}
.skin-card.equipped { border-color: var(--mint); }
.skin-preview {
  display: block;
  width: 100%;
  height: 82px;
  object-fit: contain;
  image-rendering: pixelated;
  background: color-mix(in srgb, var(--skin-color) 18%, #192328);
}
.skin-name { align-self: center; font-size: 14px; text-align: center; overflow-wrap: anywhere; }
.skin-action { min-height: 38px; padding: 0 5px; font-size: 13px; color: var(--mint); }
.skin-action:disabled { background: #202729; color: var(--muted); cursor: default; }
.skin-card.equipped .skin-action { color: var(--mint); }

.level-home {
  position: relative;
  z-index: 2;
  min-height: 100%;
  display: grid;
  place-items: center;
  padding: 40px 24px;
  background: #101617bb;
}
.level-picker { width: min(100%, 1040px); }
.level-picker h1 { margin: 0 0 22px; font-size: 44px; line-height: 1.05; }
.difficulty-sections { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.difficulty-section {
  --level-accent: #9ef2ce;
  min-width: 0;
}
.difficulty-section[data-difficulty="Normal"] { --level-accent: #b7d3ff; }
.difficulty-section[data-difficulty="Hard"] { --level-accent: #ffbd9f; }
.difficulty-section h2 {
  margin: 0 0 10px;
  padding: 0 0 7px;
  border-bottom: 2px solid var(--level-accent);
  color: var(--level-accent);
  font-size: 16px;
}
.level-grid { display: grid; gap: 10px; }
.level-option {
  min-width: 0;
  display: grid;
  grid-template-rows: auto 1fr;
  overflow: hidden;
  padding: 0;
  border: 1px solid #55625f;
  border-radius: 8px;
  background: #1b2224;
  text-align: left;
}
.level-option:is(:hover, :focus-visible) { border-color: var(--level-accent); background: #2b3536; }
.level-option:disabled { cursor: default; opacity: 0.65; }
.level-preview { display: block; width: 100%; aspect-ratio: 8 / 3; background: #34414c; }
.level-details { min-width: 0; display: grid; gap: 7px; padding: 14px; }
.level-details strong { font-size: 20px; line-height: 1.2; overflow-wrap: anywhere; }
.bot-total { color: var(--muted); font-size: 14px; }

.field { position: relative; min-height: 0; overflow: hidden; background: #302a39; isolation: isolate; }
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#game:focus { outline: none; }
.field-hud, .meters, .stage-status { position: absolute; z-index: 1; pointer-events: none; }
.field-hud {
  top: 18px;
  inset-inline: 22px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}
.stage-readout, .objective {
  display: grid;
  gap: 3px;
  padding: 9px 12px;
  border-top: 2px solid var(--mint);
  background: #14191ce8;
}
.stage-readout span, .objective strong, .meters label {
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}
.stage-readout strong { font-size: 15px; }
.objective { text-align: right; border-color: var(--amber); }
.objective span { color: var(--amber); font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
.meters {
  top: 96px;
  left: 22px;
  width: 224px;
  padding: 9px 12px;
  background: #14191ce8;
}
.meters label { display: grid; grid-template-columns: 44px 1fr 8ch; align-items: center; gap: 6px; }
.meters label span { text-align: right; font-size: 11px; font-variant-numeric: tabular-nums; }
meter { width: 100%; height: 11px; }
meter::-webkit-meter-bar { border: 0; border-radius: 2px; background: #354042; }
meter::-webkit-meter-optimum-value { background: var(--mint); }
#health::-webkit-meter-optimum-value { background: #ffa688; }

.stage-status {
  bottom: 16px;
  left: 22px;
  margin: 0;
  padding: 7px 11px;
  background: #14191ce8;
  border-left: 2px solid var(--amber);
  color: var(--text);
  font-size: 14px;
}
.stage-status.open { border-color: var(--mint); color: var(--mint); }

.stage-overlay {
  position: absolute;
  z-index: 2;
  inset: 0;
  display: grid;
  align-content: center;
  padding: 70px max(26px, 7%);
  background: linear-gradient(90deg, #131719f5, #131719c9 32%, #13171928 75%);
}
.result { max-width: 480px; }
.result h2 { margin: 0; font-size: 40px; line-height: 1.08; overflow-wrap: anywhere; }
#resultDescription { color: #d7e0d9; font-size: 16px; line-height: 1.4; }
#resultAction {
  min-height: 46px;
  padding: 0 20px;
  border: 1px solid var(--mint);
  border-radius: 6px;
  background: var(--mint);
  color: #141c19;
  font-weight: 850;
}
#resultAction:hover { background: #c3ffe5; }
button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

.workbench { justify-content: space-between; border-top: 1px solid var(--line); }
.power-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; width: min(100%, 600px); }
.power {
  min-width: 0;
  min-height: 42px;
  padding: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  border: 1px solid var(--line);
  border-bottom: 2px solid var(--power-color);
  border-radius: 6px;
  background: #22292c;
  font-size: 12px;
  font-weight: 750;
}
.power:hover, .power[aria-pressed="true"] { border-color: var(--power-color); background: #384346; }
kbd { color: var(--mint); font: 750 11px ui-monospace, monospace; }
.key-guide { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 5px 12px; color: var(--muted); font-size: 12px; }
.key-guide span { white-space: nowrap; }
.touch-controls { display: none; }
.load-error { margin: 18px 0 0; color: var(--amber); }

@media (max-width: 900px) {
  .workbench { flex-direction: column; gap: 8px; }
  .key-guide { justify-content: center; }
}

@media (max-width: 660px) {
  .level-home { padding: 24px 14px; }
  .level-picker { max-width: 460px; }
  .level-picker h1 { margin-bottom: 16px; font-size: 34px; }
  .difficulty-sections { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .difficulty-section h2 { margin-bottom: 6px; padding-bottom: 4px; }
  .level-grid { gap: 8px; }
  .level-option { grid-template-columns: 31% minmax(0, 1fr); grid-template-rows: auto; }
  .level-preview { height: 100%; min-height: 68px; object-fit: cover; }
  .level-details { align-content: center; padding: 8px 10px; gap: 4px; }
  .level-details strong { font-size: 17px; }
}

@media (max-width: 550px) {
  .topbar, .workbench { padding: 8px 10px; gap: 8px; }
  .topbar { flex-wrap: wrap; }
  .identity { gap: 4px; }
  .identity strong { font-size: 13px; }
  .identity div span { font-size: 11px; }
  .insignia { flex-basis: 20px; width: 20px; height: 24px; }
  .secondary { font-size: 12px; min-height: 37px; }
  .secondary { padding: 0 7px; }
  .shop-button { gap: 5px; }
  .field-hud { top: 12px; inset-inline: 10px; }
  .meters { top: 78px; left: 10px; }
  .result h2 { font-size: 34px; }
  .stage-overlay { padding: 54px 20px; }
  .stage-status { left: 10px; }
  .power { display: grid; gap: 0; font-size: 10px; padding: 3px 0; }
  .power-grid { gap: 3px; }
}

@media (max-width: 400px) {
  .skin-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (pointer: coarse) {
  .touch-controls {
    position: absolute;
    z-index: 1;
    bottom: 10px;
    inset-inline: 10px;
    display: flex;
    gap: 8px;
    justify-content: space-between;
    pointer-events: none;
  }
  .touch-group { display: flex; gap: 4px; }
  .touch-controls button { min-width: 42px; padding: 0 5px; pointer-events: auto; touch-action: none; font-size: 13px; }
  .key-guide { display: none; }
  .stage-status { bottom: 59px; }
}
</style>
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div class="identity">
        <span class="insignia" aria-hidden="true"></span>
        <div><strong>Electron Energy</strong><span>Platform Trials</span></div>
      </div>
      <button id="musicButton" class="secondary music-toggle" type="button" aria-label="Music" aria-pressed="true" title="Toggle music">&#9835;</button>
      <button id="shopButton" class="secondary shop-button" type="button" aria-haspopup="dialog">
        Shop <span id="creditBalance" class="credit-total">0 CR</span>
      </button>
      <button id="homeButton" class="secondary" type="button" hidden>Levels</button>
      <button id="restartButton" class="secondary" type="button" hidden>Restart</button>
    </header>

    <section class="field" aria-label="Platform trials">
      <canvas id="game" tabindex="-1" aria-label="Electron Energy playfield"></canvas>

      <section id="levelHome" class="level-home" aria-labelledby="homeTitle">
        <div class="level-picker">
          <h1 id="homeTitle">Choose a level</h1>
          <div class="difficulty-sections">
            <section class="difficulty-section" data-difficulty="Practice" aria-labelledby="practiceHeading">
              <h2 id="practiceHeading">Practice</h2>
              <div class="level-grid"></div>
            </section>
            <section class="difficulty-section" data-difficulty="Normal" aria-labelledby="normalHeading">
              <h2 id="normalHeading">Normal</h2>
              <div class="level-grid"></div>
            </section>
            <section class="difficulty-section" data-difficulty="Hard" aria-labelledby="hardHeading">
              <h2 id="hardHeading">Hard</h2>
              <div class="level-grid"></div>
            </section>
          </div>
          <template id="levelOptionTemplate">
            <button class="level-option" type="button">
              <canvas class="level-preview" width="384" height="144" aria-hidden="true"></canvas>
              <span class="level-details">
                <strong class="level-name"></strong>
                <span class="bot-total"></span>
              </span>
            </button>
          </template>
          <p id="loadError" class="load-error" role="alert" hidden>The game could not load. Reopen this HTML file in a browser with JavaScript enabled.</p>
          <noscript><p class="load-error">JavaScript is required to play a level.</p></noscript>
        </div>
      </section>

      <div id="playHud" hidden>
        <div class="field-hud">
          <div class="stage-readout"><span id="stageNumber">STAGE 01</span><strong id="stageName">Training Grounds</strong></div>
          <div class="objective"><span id="botCount">0 / 3</span><strong>Bots defeated</strong></div>
        </div>
        <div class="meters">
          <label>Health <meter id="health" min="0" max="100" value="100"></meter><span id="healthAmount" aria-hidden="true">100/100</span></label>
          <label>Energy <meter id="energy" min="0" max="100" value="100"></meter><span id="energyAmount" aria-hidden="true">100/100</span></label>
        </div>
        <p id="status" class="stage-status" role="status">Finish locked</p>
        <div class="touch-controls" aria-label="Touch controls">
          <div class="touch-group">
            <button data-action="left" aria-label="Move left" type="button">&#8592;</button>
            <button data-action="right" aria-label="Move right" type="button">&#8594;</button>
          </div>
          <div class="touch-group">
            <button data-action="jump" type="button">Jump</button>
            <button data-action="flight" type="button">Fly</button>
            <button data-action="attack" type="button">Cast</button>
          </div>
        </div>
      </div>

      <section id="stageResult" class="stage-overlay" aria-labelledby="resultTitle" hidden>
        <div class="result">
          <h2 id="resultTitle"></h2>
          <p id="resultDescription"></p>
          <button id="resultAction" type="button"></button>
        </div>
      </section>
    </section>

    <footer id="workbench" class="workbench" hidden>
      <div id="powerGrid" class="power-grid" aria-label="Powers"></div>
      <div class="key-guide">
        <span><kbd>A</kbd> <kbd>D</kbd> Move</span>
        <span><kbd>Space</kbd> Jump</span>
        <span><kbd>F</kbd> Cast</span>
        <span><kbd>Shift</kbd> Fly</span>
      </div>
    </footer>
  </main>
  <dialog id="upgradeShop" class="shop-dialog" aria-labelledby="shopHeading">
    <header class="shop-header">
      <div>
        <h2 id="shopHeading">Shop</h2>
        <div id="shopBalance" class="credit-total">0 CR</div>
      </div>
      <button id="closeShopButton" class="secondary" type="button" autofocus>Done</button>
    </header>
    <div class="shop-tabs" role="group" aria-label="Shop section">
      <button id="shopUpgradesTab" class="secondary" type="button" aria-pressed="true" aria-controls="upgradeList">Upgrades</button>
      <button id="shopSkinsTab" class="secondary" type="button" aria-pressed="false" aria-controls="skinList">Skins</button>
    </div>
    <div id="upgradeList" class="upgrade-list" aria-label="Upgrades"></div>
    <div id="skinList" class="skin-list" aria-label="Skins" hidden></div>
    <p id="shopFeedback" class="shop-feedback" role="status"></p>
    <template id="upgradeTemplate">
      <div class="upgrade-row">
        <div class="upgrade-details">
          <strong class="upgrade-name"></strong>
          <span class="upgrade-stat"></span>
        </div>
        <button class="secondary upgrade-buy" type="button"></button>
      </div>
    </template>
    <template id="skinTemplate">
      <div class="skin-card">
        <canvas class="skin-preview" width="112" height="100" aria-hidden="true"></canvas>
        <strong class="skin-name"></strong>
        <button class="secondary skin-action" type="button"></button>
      </div>
    </template>
  </dialog>
  <script>
    window.addEventListener("load", () => {
      if (document.documentElement.dataset.gameReady) return;
      document.querySelector("#loadError").hidden = false;
      document.querySelectorAll("[data-level]").forEach((button) => { button.disabled = true; });
      document.querySelector("#shopButton").disabled = true;
    }, { once: true });
  </script>

<script>
"use strict";

const skinCatalog = {
  pilot: { name: "Original", cost: 0, color: "#85ccad" },
  shark: { name: "Shark", cost: 120, color: "#70bfd9" },
  messi: { name: "Lionel Messi", cost: 210, color: "#9fcfff" },
  bear: { name: "Bear", cost: 135, color: "#c79774" },
  polarBear: { name: "Polar Bear", cost: 165, color: "#e4f1f8" },
  cookie: { name: "Cookie", cost: 90, color: "#f0b777" },
  chameleon: { name: "Chameleon", cost: 180, color: "#b7df75" }
};

function drawSkinSprite(context, id, stride = 0, armored = false) {
  const rect = (color, x, y, width, height) => {
    context.fillStyle = color;
    context.fillRect(x, y, width, height);
  };
  const shape = (color, points) => {
    context.fillStyle = color;
    context.beginPath();
    context.moveTo(...points[0]);
    for (const point of points.slice(1)) context.lineTo(...point);
    context.closePath();
    context.fill();
  };
  const legs = (light, shadow, feet) => {
    rect(light, -12, 10, 9, 12 + stride / 2);
    rect(shadow, 3, 10, 9, 12 - stride / 2);
    rect(feet, -14, 19 + stride / 2, 12, 5);
    rect(feet, 2, 19 - stride / 2, 12, 5);
  };

  switch (id) {
    case "shark":
      legs("#649db8", "#45718c", "#243949");
      shape("#273b54", [[-20, -2], [-31, -13], [-33, 4], [-28, 14], [-20, 7], [-12, 9], [-6, 15],
        [15, 15], [21, 10], [29, 7], [29, -3], [23, -9], [11, -13], [-1, -13], [-6, -25], [-15, -13], [-16, -8]]);
      shape("#70b4d5", [[-19, 0], [-29, -8], [-30, 5], [-27, 10], [-20, 4], [-11, 7],
        [-3, 12], [14, 12], [22, 6], [26, 5], [26, -2], [20, -7], [9, -10], [-3, -10], [-7, -20], [-13, -10]]);
      shape("#d9eef4", [[-13, 4], [-3, 2], [12, 2], [23, 0], [26, 1], [26, 6], [19, 11], [13, 13], [-3, 13]]);
      shape("#4f87ae", [[-9, 1], [0, 2], [-2, 11], [-10, 15], [-13, 12]]);
      rect("#213041", 16, -6, 4, 4);
      rect("#213041", 17, 4, 9, 2);
      rect("#fff5dc", 20, 4, 2, 2);
      rect("#fff5dc", 24, 4, 2, 2);
      rect("#4d85a5", 6, -2, 2, 5);
      rect("#4d85a5", 10, -2, 2, 5);
      break;
    case "messi":
      legs("#e9f3f6", "#9cc5dc", "#273544");
      rect("#25354b", -12, 7, 23, 7);
      shape("#27354a", [[-16, -8], [-11, -12], [10, -12], [16, -7], [15, 6], [10, 10],
        [-12, 10], [-15, 6]]);
      rect("#eff4e8", -12, -9, 24, 17);
      rect("#83c4e7", -10, -9, 4, 17);
      rect("#83c4e7", -2, -9, 5, 17);
      rect("#83c4e7", 7, -9, 4, 17);
      rect("#bc825a", 12, 0, 6, 7);
      rect("#bc825a", -17, 0, 5, 6);
      rect("#25354b", -4, -3, 1, 6);
      rect("#25354b", -6, 2, 4, 1);
      rect("#25354b", 0, -3, 4, 1);
      rect("#25354b", 0, 2, 4, 1);
      rect("#25354b", 0, -3, 1, 6);
      rect("#25354b", 3, -3, 1, 6);
      shape("#392b2b", [[-10, -27], [5, -28], [12, -24], [15, -20], [14, -13], [10, -8],
        [-7, -8], [-11, -13], [-13, -22]]);
      rect("#dca378", -7, -22, 18, 12);
      rect("#b47954", -9, -18, 3, 7);
      rect("#563a31", -9, -25, 18, 4);
      rect("#392b2b", 4, -18, 4, 2);
      rect("#50362f", 6, -14, 6, 5);
      rect("#dca378", 10, -17, 4, 3);
      rect("#754d38", 8, -12, 4, 1);
      break;
    case "bear":
    case "polarBear": {
      const polar = id === "polarBear";
      const fur = polar ? "#e9f4f2" : "#a97150";
      const shade = polar ? "#a9c2d0" : "#754c3b";
      const muzzle = polar ? "#cddfe1" : "#deab7c";
      legs(fur, shade, shade);
      rect(shade, -15, -21, 9, 10);
      rect(shade, 5, -24, 9, 10);
      rect(fur, -13, -21, 5, 5);
      rect(fur, 6, -23, 6, 6);
      shape(shade, [[-12, -18], [11, -19], [19, -14], [21, -8], [17, -3], [18, 5],
        [13, 15], [-13, 15], [-19, 7], [-19, -8]]);
      shape(fur, [[-10, -16], [10, -17], [16, -12], [18, -8], [14, -4], [15, 5], [10, 12],
        [-12, 12], [-16, 7], [-16, -7]]);
      rect(muzzle, 10, -11, 11, 7);
      rect("#303238", 17, -11, 5, 4);
      rect("#303238", 10, -15, 3, 3);
      rect(shade, -7, 2, 14, 5);
      rect(muzzle, -7, 0, 13, 5);
      rect(shade, 9, 6, 4, 4);
      break;
    }
    case "cookie":
      legs("#b97b53", "#9c5c42", "#714638");

    upgrades: Object.fromEntries(Object.keys(upgradeOptions).map((id) => {
      const level = saved?.upgrades?.[id];

function upgradeValue(id, level = progress.upgrades[id]) {

function input(action) {
  for (const code of keys) if (keyActions[code] === action) return true;
  for (const held of touches.values()) if (held === action) return true;
  return false;
}

function standing(body) {
  if (body.velocity.y < -0.1) return false;
  const feet = body.bounds.max.y;
  if (Math.abs(feet - floorY) < 3) return true;
  return stage().platforms.some(([x, y, width]) =>
    Math.abs(feet - y) < 3 && body.bounds.max.x > x && body.bounds.min.x < x + width
  );
}

function cast(target) {
  if (phase !== "playing" || player.cooldown > 0) return;
  const power = powers[selectedPower];
  if (player.energy < power.cost) return;
  const { x, y } = player.body.position;
  const dx = target ? target.x - x : player.facing;
  const dy = target ? target.y - y : 0;
  const length = Math.hypot(dx, dy);
  const vx = length ? dx / length : player.facing;
  const vy = length ? dy / length : 0;
  if (Math.abs(vx) > 0.12) player.facing = Math.sign(vx);
  player.energy -= power.cost;
  player.cooldown = 15;
  shots.push({ x, y, vx: vx * power.speed, vy: vy * power.speed,
    power, life: power.life, hit: new Set() });
  burst(x + vx * 17, y + vy * 17, power.color, 5);
}

function burst(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 6;
    sparks.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      life: 12 + Math.random() * 17, color });
  }
}

function fireBot(bot) {
  const { x, y } = bot.body.position;
  const dx = player.body.position.x - x;
  const dy = player.body.position.y - y;
  const distance = Math.hypot(dx, dy);
  if (distance > 410 || distance < 12 || Math.abs(dy) > 105 || bot.cooldown > 0) return;
  const hard = stage().difficulty === "Hard";
  const speed = hard ? 8 : 6;
  shots.push({ x, y, vx: dx / distance * speed, vy: dy / distance * speed, life: 80, hostile: true });
  bot.cooldown = hard ? 68 : 100;
}

function hit(body, shot, padding) {
  return shot.x >= body.bounds.min.x - padding && shot.x <= body.bounds.max.x + padding &&
    shot.y >= body.bounds.min.y - padding && shot.y <= body.bounds.max.y + padding;
}

function damagePlayer(amount) {
  if (player.invulnerable > 0 || amount === 0) return;
  const damage = Math.max(1, Math.round(amount * (100 - upgradeValue("armor")) / 100));
  player.hp = Math.max(0, player.hp - damage);
  player.invulnerable = 42;
  burst(player.body.position.x, player.body.position.y, "#ff9d77", 11);
}

function moveShots() {
  for (const shot of shots) {
    if (shotCollides(shot)) shot.life = 0;
    else {
      shot.x += shot.vx;
      shot.y += shot.vy;
      shot.life--;
    }
  }
  shots = shots.filter((shot) => shot.life > 0);
}

function shotCollides(shot) {
  if (shot.x < 0 || shot.x > stage().width || shot.y > floorY ||
      stage().platforms.some(([x, y, width]) =>
        shot.x >= x && shot.x <= x + width && shot.y >= y && shot.y <= y + 24)) return true;
  if (shot.hostile) {
    if (!hit(player.body, shot, 4)) return false;
    damagePlayer(stage().damage);
    return true;
  }
  for (const bot of bots) {
    if (bot.hp <= 0 || shot.hit.has(bot) || !hit(bot.body, shot, 6)) continue;
    shot.hit.add(bot);
    bot.hp -= shot.power.damage;
    bot.stun = shot.power.stun || 16;
    burst(shot.x, shot.y, shot.power.color, bot.hp <= 0 ? 18 : 7);
    if (bot.hp <= 0) {
      Composite.remove(engine.world, bot.body);
      awardCredits(rewards[stage().difficulty].bot);
    }
    if (!shot.power.pierce) return true;
  }
  return false;
}

function simulate() {
  if (phase !== "playing" || ui.upgradeShop.open) return;
  frame++;
  const body = player.body;
  const axis = Number(input("right")) - Number(input("left"));
  if (axis) player.facing = axis;
  player.coyote = standing(body) ? 5 : Math.max(0, player.coyote - 1);
  let vy = body.velocity.y;
  const jump = nextJump;
  nextJump = false;
  player.flying = input("flight") && player.energy > 0.9;
  if (jump && player.coyote > 0) {
    vy = -9.7;
    player.coyote = 0;
  } else if (player.flying) {
    vy = Math.max(-5.5, vy - 0.95);
    player.energy -= 0.65;
    if (frame % 3 === 0) burst(body.position.x - player.facing * 16, body.position.y + 9, "#a7ffdc", 2);
  }
  const edge = Math.max(18, Math.min(stage().width - 18, body.position.x));
  if (edge !== body.position.x) Body.setPosition(body, { x: edge, y: body.position.y });
  Body.setVelocity(body, { x: axis * (player.flying ? 7.2 : 5.65), y: Math.min(vy, 15) });
  if (!player.flying) player.energy = Math.min(player.maxEnergy, player.energy + 0.31);
  player.cooldown = Math.max(0, player.cooldown - 1);
  player.invulnerable = Math.max(0, player.invulnerable - 1);
  if (input("attack")) cast();

  for (const bot of bots) {
    if (bot.hp <= 0) continue;
    const { x, y } = bot.body.position;
    if (x <= bot.left) bot.direction = 1;
    if (x >= bot.right) bot.direction = -1;
    bot.cooldown--;
    bot.stun = Math.max(0, bot.stun - 1);
    Body.setVelocity(bot.body, { x: bot.stun ? 0 : bot.direction * stage().speed, y: bot.body.velocity.y });
    if (stage().damage && !bot.stun) {
      fireBot(bot);
      if (Math.abs(body.position.x - x) < 31 && Math.abs(body.position.y - y) < 35) damagePlayer(stage().damage);
    }
  }
  Engine.update(engine, tick);
  moveShots();
  for (const spark of sparks) {
    spark.x += spark.vx;
    spark.y += spark.vy;
    spark.vy += 0.17;
    spark.life--;
  }
  sparks = sparks.filter((spark) => spark.life > 0);
  if (barrier && bots.every((bot) => bot.hp <= 0)) {
    Composite.remove(engine.world, barrier);
    barrier = null;
    burst(finishX(), floorY - 75, "#a7ffdc", 25);
  }
  if (player.hp <= 0) {
    phase = "failed";
    showResult("Trial interrupted", "Restart this level to try again.", "Retry level");
  } else if (!barrier && body.position.x >= finishX() && body.position.y >= floorY - 134) {
    phase = "cleared";
    const bonus = rewards[stage().difficulty].clear;
    awardCredits(bonus);
    const last = stageIndex === stages.length - 1;
    showResult(last ? "Trials cleared" : "Level cleared",
      (last ? "Final finish line crossed." : "Every bot defeated. Finish line crossed.") +
        " +" + formatCredits(bonus) + " finish bonus.",
      last ? "Choose a level" : "Next level");
  }
  syncHud();
}

function setText(element, text) {
  if (element.textContent !== text) element.textContent = text;
}

function syncHud() {
  const total = bots.length;
  const defeated = bots.filter((bot) => bot.hp <= 0).length;
  setText(ui.botCount, defeated + " / " + total);
  syncMeter(ui.health, ui.healthAmount, player.hp, player.maxHealth);
  syncMeter(ui.energy, ui.energyAmount, player.energy, player.maxEnergy);
  const status = phase === "cleared" ? "Stage complete" :
    barrier ? "Finish locked" : "Finish open";
  setText(ui.status, status);
  ui.status.classList.toggle("open", !barrier);
}

function syncMeter(meter, readout, amount, maximum) {
  const value = Math.ceil(amount);
  if (meter.max !== maximum) meter.max = maximum;
  if (meter.value !== value) meter.value = value;
  setText(readout, value + "/" + maximum);
}

function updateShop() {
  syncCredits();
  for (const { id, option, stat, buy } of shopRows) {
    const level = progress.upgrades[id];
    const maxed = level === upgradeLimit;
    const cost = option.cost + option.costStep * level;
    const current = upgradeValue(id);
    const values = maxed ? String(current) : current + " to " + upgradeValue(id, level + 1);
    stat.textContent = "Lv. " + level + "/" + upgradeLimit + " | " + values + option.unit;
    buy.textContent = maxed ? "Maxed" : formatCredits(cost);
    buy.disabled = maxed || progress.credits < cost;
    buy.setAttribute("aria-label", maxed ? option.name + " maxed" : "Upgrade " + option.name + " for " + formatCredits(cost));
  }
  for (const { id, skin, card, action } of skinRows) {
    const owned = progress.ownedSkins.includes(id);
    const equipped = progress.skin === id;
    card.classList.toggle("equipped", equipped);
    action.disabled = equipped || (!owned && progress.credits < skin.cost);
    if (equipped) {
      action.textContent = "Equipped";
      action.setAttribute("aria-label", skin.name + " equipped");
    } else if (owned) {
      action.textContent = "Equip";
      action.setAttribute("aria-label", "Equip " + skin.name);
    } else {
      action.textContent = formatCredits(skin.cost);
      action.setAttribute("aria-label", "Buy " + skin.name + " for " + formatCredits(skin.cost));
    }
  }
}

function reportShopChange(message, saved) {
  ui.shopFeedback.textContent = message + (saved ? "" : " Progress is available for this session.");
}

function buyUpgrade(id) {
  const option = upgradeOptions[id];
  const level = progress.upgrades[id];
  const cost = option.cost + option.costStep * level;
  if (level >= upgradeLimit || progress.credits < cost) return;
  progress.credits -= cost;
  progress.upgrades[id]++;
  const saved = saveProgress();
  if (phase === "playing") {
    const maxHealth = upgradeValue("health");
    const maxEnergy = upgradeValue("energy");
    player.hp += maxHealth - player.maxHealth;
    player.energy += maxEnergy - player.maxEnergy;
    player.maxHealth = maxHealth;
    player.maxEnergy = maxEnergy;
    syncHud();
  }
  updateShop();
  reportShopChange(option.name + " upgraded to level " + progress.upgrades[id] + ".", saved);
}

function chooseSkin(id) {
  const skin = skinCatalog[id];
  const owned = progress.ownedSkins.includes(id);
  if (progress.skin === id || (!owned && progress.credits < skin.cost)) return;
  if (!owned) {
    progress.credits -= skin.cost;
    progress.ownedSkins.push(id);
  }
  progress.skin = id;
  const saved = saveProgress();
  updateShop();
  reportShopChange(skin.name + (owned ? " equipped." : " unlocked and equipped."), saved);
  draw();
}

function showSkins(show) {
  ui.shopUpgradesTab.setAttribute("aria-pressed", String(!show));
  ui.shopSkinsTab.setAttribute("aria-pressed", String(show));
  ui.upgradeList.hidden = show;
  ui.skinList.hidden = !show;
  ui.shopFeedback.textContent = "";
}

function renderSkins() {
  for (const [id, skin] of Object.entries(skinCatalog)) {
    const card = ui.skinTemplate.content.firstElementChild.cloneNode(true);
    card.style.setProperty("--skin-color", skin.color);
    card.querySelector(".skin-name").textContent = skin.name;
    const preview = card.querySelector(".skin-preview");
    const art = preview.getContext("2d");
    art.translate(preview.width / 2, preview.height / 2);
    art.scale(1.5, 1.5);
    drawSkinSprite(art, id);
    const action = card.querySelector(".skin-action");
    action.addEventListener("click", () => {
      chooseSkin(id);
      if (action.disabled) ui.shopSkinsTab.focus();
    });
    skinRows.push({ id, skin, card, action });
    ui.skinList.append(card);
  }
}

function renderShop() {
  for (const [id, option] of Object.entries(upgradeOptions)) {
    const row = ui.upgradeTemplate.content.firstElementChild.cloneNode(true);
    row.querySelector(".upgrade-name").textContent = option.name;
    const stat = row.querySelector(".upgrade-stat");
    const buy = row.querySelector(".upgrade-buy");
    buy.addEventListener("click", () => {
      buyUpgrade(id);
      if (buy.disabled) ui.closeShopButton.focus();
    });
    shopRows.push({ id, option, stat, buy });
    ui.upgradeList.append(row);
  }
  renderSkins();
  updateShop();
}

function selectPower(index) {
  selectedPower = index;
  for (const [i, button] of [...ui.powerGrid.children].entries()) {
    button.setAttribute("aria-pressed", String(i === index));
  }
}

function renderPowers() {
  powers.forEach((power, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "power";
    button.style.setProperty("--power-color", power.color);
    const key = document.createElement("kbd");
    key.textContent = String(index + 1);
    const name = document.createElement("span");
    name.textContent = power.name;
    button.append(key, name);
    button.addEventListener("click", () => {
      selectPower(index);
      if (phase === "playing") canvas.focus({ preventScroll: true });
    });
    ui.powerGrid.append(button);
  });
  selectPower(selectedPower);
}

function startMusic() {
  if (!music.enabled || music.timer !== null) return;
  try {
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) return;
    music.audio ||= new Audio();
    music.audio.resume().catch(() => {});
    music.timer = window.setInterval(playBeat, 150);
  } catch {
    music.enabled = false;
    ui.musicButton.setAttribute("aria-pressed", "false");
  }
}

function playBeat() {
  const audio = music.audio;
  if (audio.state !== "running" || phase !== "playing" || ui.upgradeShop.open) return;
  const beat = music.beat++ % 16;
  const bass = [55, 55, 82.41, 55, 73.42, 55, 98, 82.41, 55, 55, 82.41, 110, 98, 82.41, 73.42, 65.41];
  note(bass[beat], 0.045, 0.17, "triangle");
  if (beat % 4 === 0) note(55, 0.08, 0.11, "sine", 135);
  if (beat % 2 === 1) note(beat % 4 === 1 ? 392 : 329.63, 0.02, 0.055, "triangle");
}

function note(frequency, volume, duration, type, start = frequency) {
  const audio = music.audio;
  const now = audio.currentTime;
  const oscillator = audio.createOscillator();
  const gain = audio.createGain();
  oscillator.type = type;
  oscillator.frequency.setValueAtTime(start, now);
  oscillator.frequency.exponentialRampToValueAtTime(frequency, now + duration);
  gain.gain.setValueAtTime(volume, now);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
  oscillator.connect(gain);
  gain.connect(audio.destination);
  oscillator.start(now);
  oscillator.stop(now + duration);
}

function resize() {
  const { width, height } = canvas.getBoundingClientRect();
  if (!width || !height) return;
  view.dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(width * view.dpr);
  canvas.height = Math.round(height * view.dpr);
  view.scale = Math.min(height / 540, width / 470);
  view.width = width / view.scale;
  view.height = height / view.scale;
  draw();
}

function box(color, x, y, width, height) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, width, height);
}

function polygon(color, points) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(...points[0]);
  for (const point of points.slice(1)) ctx.lineTo(...point);
  ctx.closePath();
  ctx.fill();
}

function background() {
  const { width, height, x } = view;
  const colors = stage().sky;
  const sky = ctx.createLinearGradient(0, 0, 0, height * 0.8);
  sky.addColorStop(0, colors[0]);
  sky.addColorStop(1, colors[1]);
  box(sky, 0, 0, width, height);
  const horizon = floorY - view.y;
  for (let i = -1; i < width / 270 + 2; i++) {
    const left = i * 270 - (x * 0.22 % 270);
    polygon(stage().ridge, [[left - 65, horizon], [left + 48, horizon - 158], [left + 92, horizon - 182],
      [left + 166, horizon - 112], [left + 211, horizon - 99], [left + 308, horizon]]);
  }
  const offset = x * 0.42;
  for (let i = Math.floor(offset / 165) - 1; i < (width + offset) / 165 + 1; i++) {
    const left = i * 165 - offset;
    const roof = horizon - 60 - (i * i * 17 % 75);
    box("#323944", left, roof, 120, horizon - roof);
    box("#424851", left + 11, roof - 9, 97, 9);
    for (let j = 0; j < 5; j++) box("#d6ad7959", left + 14 + j * 19, roof + 17, 9, 3);
    if (i % 2 === 0) {
      box("#303942", left + 85, roof - 41, 4, 50);
      box("#f0a277", left + 84, roof - 42, 6, 3);
    }
    box("#242e34", left - 45, horizon - 35, 170, 40);
  }
}

function platform(x, y, width, height) {
  box(stage().rock, x, y, width, height);
  box(stage().trim, x, y, width, 5);
  box("#182126", x, y + 19, width, height - 19);
  for (let i = 12; i < width - 12; i += 29) {
    box("#738581", x + i, y + 9, 10, 3);
    if (height > 27) {
      box(stage().rock, x + i, y + 27, 18, 12);
      box("#56686b", x + i, y + 38, 18, 2);
    }
  }
}

function drawGate(x, finish) {
  const active = finish && !barrier;
  const color = finish && !active ? "#ffb36b" : "#9af0c9";
  const top = floorY - 123;
  box("#19272b", x - 35, top - 5, 70, 132);
  box("#344649", x - 28, top + 19, 56, 104);
  box(finish && !active ? "#8c533b" : "#376b5d", x - 22, top + 24, 44, 99);
  for (let row = 0; row < 8; row++) {
    const y = top + 29 + row * 11;
    box(row % 2 ? "#162b32" : color, x - 5, y, 5, 11);
    box(row % 2 ? color : "#162b32", x, y, 5, 11);
  }
  box(color, x - 35, top - 5, 70, 4);
  ctx.font = "bold 11px monospace";
  ctx.textAlign = "center";
  ctx.fillStyle = color;
  ctx.fillText(finish ? "FINISH" : "START", x, top + 13);
  ctx.textAlign = "left";
}

function drawPlayer() {
  const { x, y } = player.body.position;
  const step = Math.abs(player.body.velocity.x) > 1 ? Math.sin(frame * 0.36) * 6 : 0;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(player.facing, 1);
  if (player.invulnerable % 8 > 4) ctx.globalAlpha = 0.45;
  if (player.flying) {
    polygon("#73d9b989", [[-4, -9], [-56, -21], [-47, -4], [-57, 12], [-7, 6]]);
    polygon("#adffdf", [[-7, -8], [-47, -14], [-20, 1], [-42, 7], [-7, 5]]);
  }
  drawSkinSprite(ctx, progress.skin, step, progress.upgrades.armor > 0);
  if (progress.skin === "pilot") {
    if (player.cooldown > 9) box("#c2d5d1", 18, -6, 7, 7);
    box(powers[selectedPower].color, player.cooldown > 9 ? 20 : 15, -6, 5, 7);
  } else if (player.cooldown > 9) {
    box(powers[selectedPower].color, 30, -3, 6, 6);
  }
  ctx.restore();
}

function drawBot(bot) {
  const { x, y } = bot.body.position;
  const step = bot.stun ? 0 : Math.sin(frame * 0.18) * 3;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(bot.direction, 1);
  box("#20252d", -17, -15, 34, 29);
  box(bot.stun ? "#71afd0" : "#9d514b", -15, -13, 30, 21);
  box("#d6b2a1", -12, -16, 25, 10);
  box("#291f26", -9, -12, 22, 7);
  box("#ff9a63", 3, -10, 10, 3);
  box("#5b4045", -13, 9, 9, 10 + step);
  box("#5b4045", 4, 9, 9, 10 - step);
  box("#24272e", -15, 15 + step, 13, 4);
  box("#24272e", 2, 15 - step, 13, 4);
  if (stage().hp > 1) {
    box("#30272c", -15, -26, 30, 3);
    box("#ffa775", -15, -26, 30 * bot.hp / stage().hp, 3);
  }
  ctx.restore();
}

function drawShot(shot) {
  ctx.save();
  ctx.translate(shot.x, shot.y);
  ctx.rotate(Math.atan2(shot.vy, shot.vx));
  const color = shot.hostile ? "#ffac6d" : shot.power.color;
  switch (shot.power?.name) {
    case "Plasma":
      polygon(color, [[11, 0], [-6, -7], [-2, -2], [-24, -3], [-12, 7], [-12, 2]]);
      break;
    case "Freeze":
      polygon(color, [[14, 0], [-6, -6], [-11, -2], [-12, 5]]);
      break;
    case "Earth":
      polygon(color, [[-10, 3], [-8, -7], [2, -10], [9, -5], [11, 5], [3, 10], [-5, 10]]);
      box("#956b5a", -6, 4, 11, 4);
      break;
    case "Fire":
      polygon(color, [[9, 0], [-4, -10], [-7, -4], [-27, -8], [-16, 0], [-29, 6], [-9, 6], [-4, 10]]);
      box("#ffe1a7", -12, -2, 18, 4);
      break;
    case "Water":
    case "Air":
    case "Magnet":
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(0, 0, 6, 12, 0, -Math.PI / 2, Math.PI / 2);
      ctx.ellipse(-8, 0, 5, 9, 0, -Math.PI / 2, Math.PI / 2);
      ctx.stroke();
      break;
    default:
      box(color, -6, -2, 12, 4);
  }
  ctx.restore();
}

function draw() {
  if (!view.width) return;
  ctx.setTransform(view.scale * view.dpr, 0, 0, view.scale * view.dpr, 0, 0);
  const groundViewY = floorY - view.height * 0.83;
  if (phase === "home") {
    view.y = groundViewY;
    background();
    box(stage().rock, 0, floorY - view.y, view.width, view.height);
    return;
  }
  const { x, y } = player.body.position;
  const cameraTarget = Math.max(0, Math.min(stage().width - view.width, x - view.width * 0.36));
  view.x += (cameraTarget - view.x) * 0.18;
  view.y = Math.min(groundViewY, y - view.height * 0.27);
  background();
  ctx.save();
  ctx.translate(-view.x, -view.y);
  drawGate(startX, false);
  drawGate(finishX(), true);
  platform(0, floorY, stage().width, view.height);
  for (const [left, top, width] of stage().platforms) {
    for (const side of [left + 9, left + width - 15]) {
      box("#283739", side, top + 23, 6, floorY - top - 23);
    }
    platform(left, top, width, 24);
  }
  for (const bot of bots) if (bot.hp > 0) drawBot(bot);
  for (const shot of shots) drawShot(shot);
  drawPlayer();
  for (const spark of sparks) {
    ctx.globalAlpha = Math.min(1, spark.life / 9);
    box(spark.color, spark.x, spark.y, 3, 3);
  }
  ctx.restore();
}

function loop(now) {
  accumulator += lastTime ? Math.min(now - lastTime, 75) : 0;
  lastTime = now;
  while (accumulator >= tick) {
    simulate();
    accumulator -= tick;
  }
  if (phase !== "home") draw();
  requestAnimationFrame(loop);
}

function drawLevelPreview(button, layout) {
  const preview = button.querySelector("canvas");
  const art = preview.getContext("2d");
  const { width, height } = preview;
  const ground = height - 16;
  const sky = art.createLinearGradient(0, 0, 0, ground);
  sky.addColorStop(0, layout.sky[0]);
  sky.addColorStop(1, layout.sky[1]);
  art.fillStyle = sky;
  art.fillRect(0, 0, width, height);

  art.fillStyle = layout.ridge;
  art.beginPath();
  art.moveTo(0, ground - 20);
  art.lineTo(66, ground - 82);
  art.lineTo(144, ground - 53);
  art.lineTo(233, ground - 94);
  art.lineTo(318, ground - 58);
  art.lineTo(width, ground - 74);
  art.lineTo(width, ground);
  art.lineTo(0, ground);
  art.fill();

  const scaleX = width / layout.width;
  const scaleY = (ground - 12) / floorY;
  art.fillStyle = layout.rock;
  art.fillRect(0, ground, width, height - ground);
  for (const [x, y, length] of layout.platforms) {
    art.fillStyle = layout.rock;
    art.fillRect(x * scaleX + 2, y * scaleY + 10, 2, ground - y * scaleY - 10);
    art.fillRect((x + length) * scaleX - 4, y * scaleY + 10, 2, ground - y * scaleY - 10);
    art.fillRect(x * scaleX, y * scaleY + 10, length * scaleX, 7);
    art.fillStyle = layout.trim;
    art.fillRect(x * scaleX, y * scaleY + 10, length * scaleX, 2);
  }

  art.fillStyle = "#a7ffdc";
  art.fillRect(startX * scaleX, ground - 25, 3, 25);
  art.fillStyle = "#ffbd79";
  art.fillRect((layout.width - 145) * scaleX, ground - 25, 3, 25);
}

function renderLevelMenu() {
  const template = document.getElementById("levelOptionTemplate");
  const grids = Object.fromEntries(Array.from(document.querySelectorAll(".difficulty-section"),
    (section) => [section.dataset.difficulty, section.querySelector(".level-grid")]
  ));

  stages.forEach((layout, index) => {
    const button = template.content.firstElementChild.cloneNode(true);
    button.dataset.level = String(index);
    button.querySelector(".level-name").textContent = layout.name;
    const count = layout.bots.length;
    button.querySelector(".bot-total").textContent = count + (count === 1 ? " bot" : " bots");
    drawLevelPreview(button, layout);
    button.addEventListener("click", () => launchStage(index));
    grids[layout.difficulty].append(button);
    levelButtons.push(button);
  });
}

ui.homeButton.addEventListener("click", showHome);
ui.restartButton.addEventListener("click", () => launchStage(stageIndex));
ui.shopButton.addEventListener("click", () => {
  if (ui.upgradeShop.open) return;
  resetInput();
  updateShop();
  ui.shopFeedback.textContent = "";
  ui.upgradeShop.showModal();
});
ui.closeShopButton.addEventListener("click", () => ui.upgradeShop.close());
ui.shopUpgradesTab.addEventListener("click", () => showSkins(false));
ui.shopSkinsTab.addEventListener("click", () => showSkins(true));
ui.upgradeShop.addEventListener("close", () => {
  if (phase === "playing") canvas.focus({ preventScroll: true });
});
ui.resultAction.addEventListener("click", () => {
  if (phase === "failed") launchStage(stageIndex);
  else if (phase === "cleared" && stageIndex + 1 < stages.length) launchStage(stageIndex + 1);
  else showHome();
});
ui.musicButton.addEventListener("click", () => {
  music.enabled = !music.enabled;
  ui.musicButton.setAttribute("aria-pressed", String(music.enabled));
  if (music.enabled && phase === "playing") startMusic();
  if (!music.enabled) {
    window.clearInterval(music.timer);
    music.timer = null;
  }
  if (phase === "playing") canvas.focus({ preventScroll: true });
});

window.addEventListener("keydown", (event) => {
  if (ui.upgradeShop.open) return;
  if (event.key === "Escape" && phase !== "home") {
    showHome();
    return;
  }
  if (phase !== "playing" || event.target.closest?.("button")) return;
  const powerIndex = Number(event.key) - 1;
  if (/^[1-7]$/.test(event.key)) selectPower(powerIndex);
  const action = keyActions[event.code];
  if (!action) return;
  event.preventDefault();
  if (action === "jump" && !keys.has(event.code)) nextJump = true;
  keys.add(event.code);
});
window.addEventListener("keyup", (event) => keys.delete(event.code));
window.addEventListener("blur", resetInput);
canvas.addEventListener("pointerdown", (event) => {
  if (event.button !== 0 || phase !== "playing") return;
  const bounds = canvas.getBoundingClientRect();
  canvas.focus({ preventScroll: true });
  cast({ x: view.x + (event.clientX - bounds.left) / view.scale,
    y: view.y + (event.clientY - bounds.top) / view.scale });
});
document.querySelectorAll("[data-action]").forEach((button) => {
  button.addEventListener("pointerdown", (event) => {
    if (phase !== "playing") return;
    event.preventDefault();
    const { action } = button.dataset;
    if (action === "jump") nextJump = true;
    else touches.set(event.pointerId, action);
    button.setPointerCapture(event.pointerId);
  });
  for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) {
    button.addEventListener(type, (event) => touches.delete(event.pointerId));
  }
});

renderLevelMenu();
renderPowers();
renderShop();
if (typeof ResizeObserver === "function") new ResizeObserver(resize).observe(canvas);
else window.addEventListener("resize", resize);
resize();
document.documentElement.dataset.gameReady = "true";
requestAnimationFrame(loop);
</script>
</body>
